<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#150f2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<title>협력 몬스터 퀴즈</title>
<style>
  .home { min-height: 100vh; display: grid; place-content: center; gap: 22px; text-align: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(143,114,255,.35), transparent 70%), var(--night); }
  .home .mons { font-size: 64px; letter-spacing: .1em; }
  .home h1 { font-size: clamp(42px, 9vw, 64px); color: var(--gold); line-height: 1; text-shadow: 0 4px 0 rgba(0,0,0,.4); }
  .home .lead { color: var(--muted); max-width: 30em; margin: 0 auto; }
  .roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; width: min(560px, 100%); margin: 0 auto; }
  .roles a { text-decoration: none; display: grid; gap: 6px; padding: 22px; font-size: 26px; }
  .roles a small { font-family: var(--body); font-size: 14px; opacity: .8; }
</style>
</head>
<body>
<main class="home">
  <div class="mons" aria-hidden="true">🐛🐲👹</div>
  <h1>협력 몬스터 퀴즈</h1>
  <p class="lead">누가 가장 빨리 풀었는가가 아니라, 우리 모두가 결국 해결했는가. 모둠 친구 모두가 문제를 해결해야 몬스터를 공격할 수 있어요.</p>
  <div class="roles">
    <a class="btn btn-ghost" href="teacher.html">🧑‍🏫 선생님<small>수업을 만들고 진행해요</small></a>
    <a class="btn btn-gold" href="student.html">🎒 학생<small>방 번호로 들어가요</small></a>
  </div>
</main>
</body>
</html>
